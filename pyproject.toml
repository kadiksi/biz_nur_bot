[project]
name = "corner-ops"
version = "0.1.0"
description = "Corner Group · Оперативные данные — сайт и Telegram-боты"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10,<4",
    "anthropic>=2.12",
    "aiogram>=3.13,<4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "google-auth>=2.30",
    "openpyxl>=3.1",
    "pywhispercpp>=1.5,<1.6",
    "av>=12,<16",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
"app.web" = ["templates/*.html", "templates/blocks/*.html", "static/*", "static/vendor/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
